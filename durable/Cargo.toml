[package]
name = "durable"
version = "0.1.0"
edition = "2024"
description = "Durable async workflows: native async fns that park at slow calls and resume in another process (alpha)."

[dependencies]
durable-macros = { path = "../durable-macros" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[dev-dependencies]
# `rc`: tests hold immutable `Arc`s across slow awaits.
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
# Types trusted by durable-driver's defaults.
bytes = { version = "1", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }

[lints.rust]
# Set by durable-driver (cargo durable) on the crates it builds.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(durable)"] }
