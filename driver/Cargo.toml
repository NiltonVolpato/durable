[package]
name = "durable-driver"
version = "0.1.0"
edition = "2024"

[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]
toml = { version = "0.8", default-features = false, features = ["parse"] }

[[bin]]
name = "durable-driver"
path = "src/main.rs"

[[bin]]
name = "cargo-durable"
path = "src/cargo_durable.rs"
