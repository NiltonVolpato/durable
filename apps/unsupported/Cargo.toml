[package]
name = "unsupported"
version = "0.1.0"
edition = "2024"
publish = false
description = "Code outside the alpha subset, and the errors it gets. Run check.sh."

[dependencies]
durable = { path = "../../durable" }
# `rc`: Arc/Rc serialize, and are still rejected at slow awaits.
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
# Used by examples/lint_errors.rs.
slotmap = { version = "1", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }

[package.metadata.durable]
# A handle from "another crate" (here a local one, to keep the example small).
process-local = ["lint_errors::ConnId"]

# The examples are meant not to compile; only check.sh builds them.
[features]
check = []

[[example]]
name = "macro_errors"
required-features = ["check"]

[[example]]
name = "lint_errors"
required-features = ["check"]
